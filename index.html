<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bpf-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <!-- CWV: all avatars/post media come from Supabase storage; warm the
         connection before the app bundle even parses. Hero logo renders
         above the fold on every landing view, so fetch it early too. -->
    <link rel="preconnect" href="https://wawboysisdqmzvpentfu.supabase.co" crossorigin />
    <link rel="preload" as="image" href="/bpf-home.png" />
    <link rel="icon" type="image/png" href="/BP%20Chain%20Small.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Panther Fanworks</title>
    <meta name="description" content="A Wakanda-first community for Black Panther fanfiction, art, music, cosplay, and discussion. Wakanda Forever." />
    <link rel="canonical" href="https://blackpantherfanworks.com/" />
    <meta property="og:site_name" content="Black Panther Fanworks" />
    <meta property="og:title" content="Black Panther Fanworks" />
    <meta property="og:description" content="A Wakanda-first community for Black Panther fanfiction, art, music, cosplay, and discussion." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blackpantherfanworks.com/" />
    <meta property="og:image" content="https://blackpantherfanworks.com/bpf-home.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
